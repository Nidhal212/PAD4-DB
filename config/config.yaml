# ── Dual-layer AID decisions ─────────────────────────────────
# AIDs 1920046 and 2202442: canonical copy = confirmatory/
# AIDs 2202576/2202577: prefer 2202577 for the 55 overlapping SIDs

dual_layer_canonical:
  - 1920046
  - 2202442

rfms_preferred_aid: 2202577
rfms_aids:
  - 2202576
  - 2202577

# ── Quality thresholds ───────────────────────────────────────
min_pct_ok: 85                    # minimum % rows parsed OK per source

# ── Potency aggregation ──────────────────────────────────────
# Step 03: replicate groups aggregated by log-mean
total_expected_rows: 339687       # canonical assertion in 03a_split_spaces

# ── Fingerprint + cliff parameters ──────────────────────────
fp_radius: 2                      # Morgan fingerprint radius (ECFP4)
fp_nbits: 2048                    # fingerprint bit length
sim_threshold_pairs: 0.6          # minimum Tanimoto to include a pair
sim_threshold_cliff: 0.8          # minimum Tanimoto for cliff classification

pic50_severe:   2.0               # |ΔpIC50| threshold: severe cliffs
pic50_moderate: 1.5               # |ΔpIC50| threshold: moderate cliffs
pic50_broad:    1.0               # |ΔpIC50| threshold: broad cliffs

batch_size: 500                   # fingerprint similarity batch size

# ── Source independence score weights ────────────────────────
# frozenset(sources) → score; single-source = 1.0 (hardcoded)
independence_scores:
  bindingdb+chembl+pubchem_confirmatory: 0.3
  bindingdb+pubchem_confirmatory:        0.5
  bindingdb+chembl:                      0.6
  other_multi_source:                    0.7  # fallback for unlisted combos

independence_threshold: 0.6       # score >= this → non-redundant compound

# ── Canonical number assertions ──────────────────────────────
# Pre-flight checks in Step 05. Any deviation is a pipeline error.
canonical:
  n_compounds:       3093
  n_severe_cliffs:   94
  n_hub_compounds:   4
  n_scaffolds:       1244
  n_mmp_pairs:       707
  n_mmp_cores:       24
  pic50_median:      6.84
  pic50_mean:        6.550
